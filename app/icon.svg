<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The EPFO Saathi mark: two cleared checkpoints and one still open.
    Same composition as components/Logo.tsx, but the glyph is scaled up and the
    secondary strokes are heavier and less transparent, because the header
    weights turn to mush once this is drawn at 16px.
  -->
  <rect width="32" height="32" rx="8" fill="#1257f0" />
  <g stroke="#ffffff" stroke-opacity="0.62" fill="none" stroke-linecap="round">
    <path d="M8.4 16h4.8M18.8 16h4.8" stroke-width="1.9" />
    <circle cx="24" cy="16" r="2" stroke-width="1.7" />
  </g>
  <circle cx="8" cy="16" r="1.9" fill="#ffffff" fill-opacity="0.62" />
  <circle cx="16" cy="16" r="3.6" fill="#ffffff" />
</svg>
